<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc">
  <title id="title">结构化导航示意图</title>
  <desc id="desc">展示 NavHost、导航图、目的地和返回栈之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355070"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .card { fill: #ffffff; stroke: #355070; stroke-width: 2; rx: 16; ry: 16; }
      .soft { fill: #eef4ff; stroke: #577590; stroke-width: 2; rx: 14; ry: 14; }
      .stack { fill: #fff5db; stroke: #b08968; stroke-width: 2; rx: 14; ry: 14; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; fill: #1f2933; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #334e68; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #486581; }
      .line { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #577590; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="420"/>

  <text class="label" x="40" y="52">结构化导航：宿主、目的地与返回栈</text>

  <rect class="card" x="36" y="84" width="250" height="232"/>
  <text class="label" x="62" y="126">MainActivity</text>
  <text class="small" x="62" y="154">负责应用栏和导航宿主</text>
  <rect class="soft" x="62" y="182" width="198" height="100"/>
  <text class="label" x="88" y="224">NavHostFragment</text>
  <text class="tiny" x="88" y="252">接收 NavController 的目标切换</text>

  <rect class="card" x="340" y="84" width="296" height="232"/>
  <text class="label" x="366" y="126">main_graph.xml</text>
  <text class="small" x="366" y="154">把页面关系集中声明出来</text>
  <rect class="soft" x="366" y="184" width="106" height="88"/>
  <text class="small" x="385" y="220">TaskList</text>
  <text class="tiny" x="385" y="246">start</text>
  <rect class="soft" x="488" y="184" width="126" height="88"/>
  <text class="small" x="512" y="220">TaskDetail</text>
  <text class="tiny" x="517" y="246">taskId</text>
  <path class="line" d="M 472 228 L 488 228"/>
  <text class="tiny" x="424" y="208">navigate(id)</text>

  <rect class="card" x="684" y="84" width="220" height="232"/>
  <text class="label" x="712" y="126">Back Stack</text>
  <text class="small" x="712" y="154">用户真正走过的路径</text>
  <rect class="stack" x="714" y="184" width="74" height="84"/>
  <text class="small" x="728" y="232">List</text>
  <rect class="stack" x="772" y="168" width="74" height="84"/>
  <text class="small" x="781" y="216">Detail</text>
  <rect class="stack" x="830" y="152" width="74" height="84"/>
  <text class="small" x="850" y="200">Edit</text>
  <text class="tiny" x="711" y="292">Back 依次弹出最近目的地</text>

  <path class="line" d="M 260 232 L 340 232"/>
  <path class="line" d="M 636 232 L 684 232"/>
  <path class="dash" d="M 834 332 C 740 372, 540 376, 438 334"/>
  <text class="tiny" x="527" y="388">Up 看层级，Back 看历史路径</text>
</svg>
