<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Navigation Editor 工作台示意</title>
  <desc id="desc">展示 activity_main、NavHostFragment 和导航图在 Android Studio Navigation Editor 中的工作台布局。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.frame{fill:#fff;stroke:#1f2937;stroke-width:2}.top{fill:#111827}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.soft{fill:#eef2ff;stroke:#60a5fa;stroke-width:1.5}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:1.6}.label{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;font-weight:700;fill:#111827}.small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;fill:#334155}.tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#475569}.line{stroke:#2563eb;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="940" height="500"/>
  <text class="label" x="40" y="42">Navigation Editor：把宿主、导航图和参数放进同一块工作台</text>
  <rect class="frame" x="34" y="62" width="872" height="406" rx="14"/>
  <rect class="top" x="34" y="62" width="872" height="38" rx="14"/>
  <text class="small" x="58" y="87" fill="#fff">Android Studio - main_graph.xml</text>
  <rect class="panel" x="52" y="116" width="220" height="324" rx="12"/>
  <text class="small" x="74" y="144">Component Tree</text>
  <text class="tiny" x="76" y="178">activity_main.xml</text>
  <rect class="soft" x="72" y="190" width="170" height="44" rx="8"/>
  <text class="tiny" x="86" y="216">FragmentContainerView</text>
  <text class="tiny" x="90" y="242">@id/nav_host_fragment</text>
  <text class="tiny" x="76" y="290">main_graph.xml</text>
  <text class="tiny" x="96" y="318">taskListFragment</text>
  <text class="tiny" x="96" y="344">taskDetailFragment</text>

  <rect class="panel" x="298" y="116" width="380" height="324" rx="12"/>
  <text class="small" x="320" y="144">Navigation Graph</text>
  <rect class="node" x="346" y="226" width="110" height="64" rx="16"/>
  <text class="tiny" x="370" y="262">TaskList</text>
  <rect class="node" x="520" y="226" width="126" height="64" rx="16"/>
  <text class="tiny" x="548" y="262">TaskDetail</text>
  <path class="line" d="M 456 258 L 520 258"/>
  <text class="tiny" x="458" y="238">actionTaskListToDetail</text>
  <text class="tiny" x="356" y="310">start destination</text>
  <text class="tiny" x="550" y="310">arg: taskId</text>

  <rect class="panel" x="706" y="116" width="180" height="324" rx="12"/>
  <text class="small" x="728" y="144">Attributes</text>
  <rect class="soft" x="724" y="168" width="144" height="46" rx="8"/>
  <text class="tiny" x="742" y="196">app:startDestination</text>
  <text class="tiny" x="760" y="236">taskDetailFragment</text>
  <text class="tiny" x="732" y="260">Arguments</text>
  <rect class="soft" x="724" y="270" width="144" height="60" rx="8"/>
  <text class="tiny" x="742" y="298">taskId : long</text>
  <text class="tiny" x="732" y="358">Safe Args 更容易保持参数边界稳定</text>
</svg>
