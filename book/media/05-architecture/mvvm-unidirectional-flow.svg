<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc">
  <title id="title">MVVM 单向数据流图</title>
  <desc id="desc">展示 View、ViewModel、Repository 和 uiState/effect 之间的流动方向。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c1d95"/>
    </marker>
    <style>
      .bg { fill: #faf5ff; }
      .card { fill: #ffffff; stroke: #4c1d95; stroke-width: 2.2; rx: 16; ry: 16; }
      .soft { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; rx: 16; ry: 16; }
      .accent { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; fill: #1f2937; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #4c1d95; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #475569; }
      .line { stroke: #4c1d95; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4d7c0f; stroke-width: 2.4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="420"/>
  <text class="label" x="40" y="52">MVVM：事件向上走，状态向下流</text>
  <rect class="soft" x="70" y="124" width="176" height="104"/>
  <text class="small" x="132" y="164">View</text>
  <text class="tiny" x="96" y="192">Activity / Fragment / Compose</text>
  <rect class="card" x="366" y="104" width="208" height="146"/>
  <text class="small" x="428" y="146">ViewModel</text>
  <text class="tiny" x="408" y="174">接住事件，整理 uiState</text>
  <text class="tiny" x="410" y="200">effect 单独外发</text>
  <rect class="soft" x="690" y="124" width="170" height="104"/>
  <text class="small" x="730" y="164">Repository</text>
  <text class="tiny" x="714" y="192">数据入口与来源策略</text>
  <rect class="accent" x="366" y="286" width="208" height="86"/>
  <text class="small" x="424" y="322">UiState</text>
  <text class="tiny" x="404" y="348">稳定状态，供页面渲染</text>
  <rect class="accent" x="70" y="286" width="176" height="86"/>
  <text class="small" x="126" y="322">Effect</text>
  <text class="tiny" x="108" y="348">导航、Snackbar、一次性动作</text>
  <path class="line" d="M 246 176 L 366 176"/>
  <text class="tiny" x="270" y="160">用户事件</text>
  <path class="line" d="M 574 176 L 690 176"/>
  <text class="tiny" x="614" y="160">refresh / load</text>
  <path class="dash" d="M 690 212 C 650 262, 612 286, 574 308"/>
  <text class="tiny" x="614" y="282">数据结果</text>
  <path class="dash" d="M 366 330 L 246 330"/>
  <text class="tiny" x="266" y="314">页面渲染</text>
  <path class="dash" d="M 366 314 C 320 314, 292 314, 246 314"/>
  <path class="dash" d="M 366 286 C 326 264, 290 252, 246 228"/>
  <text class="tiny" x="44" y="92">关键纪律：View 不直接碰 Repository，Repository 也不直接改 UI</text>
</svg>
