<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Android CI/CD 分层流水线图</title>
  <desc id="desc">展示从提交、验证、候选产物到内部测试和正式发布的分层 Android 流水线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c2d12"/>
    </marker>
    <style>
      .bg { fill: #fff7ed; }
      .panel { fill: #ffffff; stroke: #9a3412; stroke-width: 2; rx: 16; ry: 16; }
      .soft { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; rx: 16; ry: 16; }
      .accent { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .note { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; ry: 16; }
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 700; fill: #1f2937; }
      .head { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; font-weight: 700; fill: #9a3412; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 15px; fill: #475569; }
      .line { stroke: #9a3412; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="430"/>
  <text class="title" x="40" y="48">CI/CD 更像一条分层交付链：先守住主干，再生成候选，再进入测试和发布</text>

  <rect class="soft" x="44" y="136" width="150" height="96"/>
  <text class="head" x="96" y="172">提交 / PR</text>
  <text class="tiny" x="74" y="202">进入统一验证环境</text>

  <rect class="accent" x="234" y="118" width="170" height="132"/>
  <text class="head" x="286" y="154">Verify</text>
  <text class="tiny" x="256" y="184">lint / 单测 / assembleDebug</text>
  <text class="tiny" x="256" y="210">目标：快、稳、能挡问题进主干</text>

  <rect class="note" x="444" y="118" width="170" height="132"/>
  <text class="head" x="476" y="154" fill="#2563eb">Candidate</text>
  <text class="tiny" x="466" y="184">bundleRelease / mapping / reports</text>
  <text class="tiny" x="470" y="210">目标：产物和证据都可追溯</text>

  <rect class="soft" x="654" y="118" width="140" height="132"/>
  <text class="head" x="680" y="154">Internal</text>
  <text class="tiny" x="674" y="184">内部测试轨道</text>
  <text class="tiny" x="674" y="210">验证安装、升级、关键路径</text>

  <rect class="panel" x="834" y="118" width="110" height="132"/>
  <text class="head" x="860" y="154">Release</text>
  <text class="tiny" x="848" y="184">灰度 / 正式</text>
  <text class="tiny" x="846" y="210">受控放量</text>

  <path class="line" d="M 194 184 L 234 184"/>
  <path class="line" d="M 404 184 L 444 184"/>
  <path class="line" d="M 614 184 L 654 184"/>
  <path class="line" d="M 794 184 L 834 184"/>

  <text class="tiny" x="44" y="314">关键纪律：不要让每次普通提交都拖进重型发布链；验证、候选产物、测试轨道和正式放量应该分层承接风险</text>
  <text class="tiny" x="44" y="342">最佳状态：提交、版本号、AAB、mapping 文件、测试报告和分发轨道能在同一条流水线里追溯回来</text>
</svg>
