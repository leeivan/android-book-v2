<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" role="img" aria-labelledby="title desc">
  <title id="title">构建变体矩阵图</title>
  <desc id="desc">展示 build type、product flavor、build variant 和 source set 之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill: #f0fdfa; }
      .panel { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 16; ry: 16; }
      .soft { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; rx: 16; ry: 16; }
      .accent { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .note { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; ry: 16; }
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 700; fill: #1f2937; }
      .head { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; font-weight: 700; fill: #0f766e; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 15px; fill: #475569; }
      .line { stroke: #0f766e; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="450"/>
  <text class="title" x="40" y="48">构建变体真正想表达的，是“行为差异”和“产品差异”如何组合成可维护产物</text>

  <rect class="panel" x="48" y="100" width="190" height="210"/>
  <text class="head" x="94" y="134">Build Type</text>
  <text class="tiny" x="78" y="172">debug</text>
  <text class="tiny" x="78" y="198">可调试、日志多、调试签名</text>
  <text class="tiny" x="78" y="236">release</text>
  <text class="tiny" x="78" y="262">压缩、正式签名、正式行为</text>

  <rect class="panel" x="282" y="100" width="190" height="210"/>
  <text class="head" x="312" y="134">Product Flavor</text>
  <text class="tiny" x="312" y="172">staging</text>
  <text class="tiny" x="312" y="198">测试域名、测试应用名</text>
  <text class="tiny" x="312" y="236">prod</text>
  <text class="tiny" x="312" y="262">线上域名、正式品牌资源</text>

  <rect class="accent" x="516" y="88" width="212" height="234"/>
  <text class="head" x="560" y="122">Build Variant</text>
  <text class="tiny" x="546" y="160">stagingDebug</text>
  <text class="tiny" x="546" y="188">stagingRelease</text>
  <text class="tiny" x="546" y="216">prodDebug</text>
  <text class="tiny" x="546" y="244">prodRelease</text>
  <text class="tiny" x="546" y="284">真正打出来的具体产物</text>

  <rect class="note" x="772" y="88" width="160" height="234"/>
  <text class="head" x="804" y="122" fill="#2563eb">Source Set</text>
  <text class="tiny" x="794" y="160">src/main</text>
  <text class="tiny" x="794" y="188">src/staging</text>
  <text class="tiny" x="794" y="216">src/prod</text>
  <text class="tiny" x="794" y="244">src/debug</text>
  <text class="tiny" x="794" y="272">src/release</text>
  <text class="tiny" x="794" y="300">差异代码和资源的落点</text>

  <path class="line" d="M 238 176 L 516 176"/>
  <path class="line" d="M 472 244 L 516 244"/>
  <path class="line" d="M 728 206 L 772 206"/>
  <text class="tiny" x="356" y="154">行为差异</text>
  <text class="tiny" x="420" y="228">产品差异</text>
  <text class="tiny" x="516" y="368">矩阵越大越要先裁掉没有业务意义的组合，例如不需要的 prodDebug</text>
</svg>
