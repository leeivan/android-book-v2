<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">Todo 最小项目骨架图</title>
  <desc id="desc">展示 Todo 项目里 UI、ViewModel、Repository、Room、WorkManager 和通知之间的协作关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .bg { fill: #eff6ff; }
      .card { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.2; rx: 16; ry: 16; }
      .soft { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 16; ry: 16; }
      .accent { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 16; ry: 16; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; fill: #1f2937; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #1d4ed8; font-weight: 700; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #475569; }
      .line { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4d7c0f; stroke-width: 2.4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .alert { stroke: #c2410c; stroke-width: 2.4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="460"/>
  <text class="label" x="40" y="50">Todo 最小骨架：先立清楚数据与系统能力的边界</text>
  <rect class="soft" x="52" y="108" width="186" height="98"/>
  <text class="small" x="92" y="146">TodoListScreen</text>
  <text class="tiny" x="88" y="174">列表、筛选、完成状态</text>
  <rect class="soft" x="52" y="244" width="186" height="98"/>
  <text class="small" x="94" y="282">TodoEditScreen</text>
  <text class="tiny" x="86" y="310">标题、备注、提醒时间</text>
  <rect class="card" x="314" y="90" width="206" height="118"/>
  <text class="small" x="356" y="128">TodoListViewModel</text>
  <text class="tiny" x="346" y="156">观察任务流，整理列表状态</text>
  <text class="tiny" x="352" y="182">UiState 只服务页面</text>
  <rect class="card" x="314" y="238" width="206" height="118"/>
  <text class="small" x="358" y="276">TodoEditViewModel</text>
  <text class="tiny" x="344" y="304">保存任务，校验表单，触发保存动作</text>
  <text class="tiny" x="352" y="330">不直接碰数据库或通知</text>
  <rect class="accent" x="596" y="164" width="210" height="118"/>
  <text class="small" x="652" y="202">TaskRepository</text>
  <text class="tiny" x="628" y="230">统一读写任务并协调提醒</text>
  <text class="tiny" x="622" y="256">把业务动作收成稳定边界</text>
  <rect class="card" x="596" y="330" width="136" height="86"/>
  <text class="small" x="638" y="366">Room</text>
  <text class="tiny" x="620" y="392">TaskDao / TaskEntity</text>
  <rect class="warn" x="748" y="330" width="152" height="86"/>
  <text class="small" x="772" y="366" fill="#c2410c">WorkManager</text>
  <text class="tiny" x="778" y="392">按时间安排任务</text>
  <rect class="warn" x="748" y="94" width="152" height="86"/>
  <text class="small" x="800" y="130" fill="#c2410c">通知</text>
  <text class="tiny" x="778" y="156">把未来事件带回用户</text>
  <path class="line" d="M 238 156 L 314 156"/>
  <path class="line" d="M 238 292 L 314 292"/>
  <path class="line" d="M 520 156 L 596 196"/>
  <path class="line" d="M 520 292 L 596 250"/>
  <path class="dash" d="M 702 282 L 664 330"/>
  <path class="alert" d="M 748 370 L 824 180"/>
  <text class="tiny" x="546" y="142">列表观察</text>
  <text class="tiny" x="548" y="314">保存 / 编辑</text>
  <text class="tiny" x="676" y="318">任务事实落库</text>
  <text class="tiny" x="760" y="304">按 dueAt 调度</text>
  <text class="tiny" x="728" y="74">到点后触发系统通知</text>
  <text class="tiny" x="52" y="438">关键纪律：UI 只和 ViewModel 对话；Repository 同时接住本地数据与系统调度</text>
</svg>
