<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">现代通知链路图</title>
  <desc id="desc">展示通知权限、渠道、通知内容、动作按钮和返回路径之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/>
    </marker>
    <style>
      .bg { fill: #fff9f5; }
      .card { fill: #ffffff; stroke: #9a3412; stroke-width: 2.2; rx: 16; ry: 16; }
      .soft { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; rx: 16; ry: 16; }
      .accent { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; fill: #1f2937; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #9a3412; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #475569; }
      .line { stroke: #9a3412; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4d7c0f; stroke-width: 2.4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="430"/>
  <text class="label" x="40" y="52">现代通知不是一条 Builder 语句，而是一整条交互链路</text>
  <rect class="soft" x="52" y="120" width="170" height="92"/>
  <text class="small" x="76" y="158">POST_NOTIFICATIONS</text>
  <text class="tiny" x="90" y="184">先解释价值，再请求权限</text>
  <rect class="card" x="278" y="120" width="154" height="92"/>
  <text class="small" x="320" y="158">Channel</text>
  <text class="tiny" x="304" y="184">让用户按类别控制通知</text>
  <rect class="card" x="486" y="108" width="170" height="116"/>
  <text class="small" x="524" y="150">Notification</text>
  <text class="tiny" x="510" y="178">标题、正文、图标、时机</text>
  <text class="tiny" x="528" y="202">是否值得打扰</text>
  <rect class="accent" x="716" y="86" width="164" height="88"/>
  <text class="small" x="748" y="124">PendingIntent</text>
  <text class="tiny" x="742" y="150">点击回到正确上下文</text>
  <rect class="accent" x="716" y="212" width="164" height="88"/>
  <text class="small" x="756" y="250">Action / Reply</text>
  <text class="tiny" x="742" y="276">降低打断后的处理成本</text>
  <rect class="soft" x="490" y="286" width="166" height="92"/>
  <text class="small" x="522" y="324">WorkManager</text>
  <text class="tiny" x="518" y="350">稍后提醒、补传、重试</text>
  <path class="line" d="M 222 166 L 278 166"/>
  <path class="line" d="M 432 166 L 486 166"/>
  <path class="line" d="M 656 150 L 716 130"/>
  <path class="line" d="M 656 182 L 716 256"/>
  <path class="dash" d="M 796 300 C 796 356, 720 372, 656 332"/>
  <text class="tiny" x="48" y="388">权限、渠道、点击返回路径和动作处理必须一起成立，通知体验才完整</text>
</svg>
