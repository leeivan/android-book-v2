<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Android 视图与 Project 视图对照示意</title>
  <desc id="desc">展示 Android Studio 的 Android 视图和 Project 视图如何映射到真实文件路径。</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.card{fill:#fff;stroke:#1f2937;stroke-width:2}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.head{fill:#e2e8f0}.accent{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.4}.label{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;font-weight:700;fill:#111827}.small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;fill:#334155}.tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#475569}.line{stroke:#60a5fa;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect class="bg" width="940" height="500"/>
  <text class="label" x="40" y="42">Android 视图便于阅读，Project 视图更接近真实磁盘结构</text>
  <rect class="card" x="40" y="66" width="390" height="394" rx="14"/>
  <rect class="head" x="40" y="66" width="390" height="34" rx="14"/>
  <text class="small" x="62" y="88">Android View</text>
  <text class="small" x="68" y="132">manifests</text>
  <rect class="accent" x="62" y="142" width="152" height="28" rx="8"/>
  <text class="tiny" x="78" y="161">AndroidManifest.xml</text>
  <text class="small" x="68" y="210">java</text>
  <text class="tiny" x="88" y="238">com.example.todobook</text>
  <text class="small" x="68" y="282">res</text>
  <text class="tiny" x="88" y="308">layout / values / drawable</text>
  <text class="small" x="68" y="352">Gradle Scripts</text>
  <text class="tiny" x="88" y="380">build.gradle.kts / settings.gradle.kts</text>

  <rect class="card" x="510" y="66" width="390" height="394" rx="14"/>
  <rect class="head" x="510" y="66" width="390" height="34" rx="14"/>
  <text class="small" x="532" y="88">Project View</text>
  <text class="tiny" x="534" y="132">project-root/</text>
  <text class="tiny" x="554" y="160">app/</text>
  <text class="tiny" x="576" y="188">src/</text>
  <text class="tiny" x="598" y="216">main/</text>
  <rect class="accent" x="590" y="228" width="186" height="28" rx="8"/>
  <text class="tiny" x="606" y="246">AndroidManifest.xml</text>
  <text class="tiny" x="620" y="280">kotlin/</text>
  <text class="tiny" x="620" y="306">res/</text>
  <text class="tiny" x="640" y="332">layout/ activity_main.xml</text>
  <text class="tiny" x="640" y="358">values/ strings.xml</text>
  <text class="tiny" x="554" y="398">build.gradle.kts</text>
  <path class="line" d="M 214 156 L 590 242"/>
  <text class="tiny" x="394" y="182">IDE 会重组展示，但真实路径在右侧</text>
</svg>
