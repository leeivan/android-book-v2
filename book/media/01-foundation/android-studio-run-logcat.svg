<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Android Studio 的 Run 与 Logcat 示意</title>
  <desc id="desc">展示第一次运行应用时应重点关注的编辑区、设备和底部日志工具窗口。</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.frame{fill:#fff;stroke:#1f2937;stroke-width:2}.top{fill:#111827}.editor{fill:#fcfcfd}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.console{fill:#0f172a}.code{font-family:Consolas,monospace;font-size:15px;fill:#334155}.log{font-family:Consolas,monospace;font-size:14px;fill:#e2e8f0}.label{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;font-weight:700;fill:#111827}.small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;fill:#334155}.tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#475569}.green{fill:#22c55e}.line{stroke:#cbd5e1;stroke-width:1.2}
    </style>
  </defs>
  <rect class="bg" width="940" height="500"/>
  <text class="label" x="40" y="42">第一次运行时，最值得盯住的是 Build / Run 与 Logcat</text>
  <rect class="frame" x="34" y="62" width="872" height="402" rx="14"/>
  <rect class="top" x="34" y="62" width="872" height="38" rx="14"/>
  <text class="small" x="58" y="87" fill="#fff">Android Studio - MainActivity.kt</text>
  <rect class="editor" x="34" y="100" width="560" height="220"/>
  <text class="code" x="58" y="138">class MainActivity : AppCompatActivity() {</text>
  <text class="code" x="82" y="168">override fun onCreate(savedInstanceState: Bundle?) {</text>
  <text class="code" x="106" y="198">setContentView(R.layout.activity_main)</text>
  <text class="code" x="106" y="228">Log.d("FirstApp", "MainActivity created")</text>
  <text class="code" x="82" y="258">}</text>
  <text class="code" x="58" y="288">}</text>
  <rect class="panel" x="618" y="118" width="258" height="202" rx="12"/>
  <text class="small" x="646" y="146">Running Devices</text>
  <rect class="panel" x="676" y="166" width="140" height="118" rx="18"/>
  <rect x="688" y="180" width="116" height="86" rx="10" fill="#dbeafe"/>
  <text class="tiny" x="715" y="218">Hello Android</text>
  <rect x="720" y="232" width="52" height="16" rx="8" fill="#2563eb"/>
  <text class="tiny" x="732" y="244" fill="#fff">Button</text>
  <circle class="green" cx="830" cy="146" r="7"/>
  <text class="tiny" x="756" y="146">Pixel 8 Pro API 35</text>
  <rect class="console" x="34" y="336" width="872" height="128" rx="0"/>
  <text class="small" x="56" y="360" fill="#fff">Logcat / Run</text>
  <text class="log" x="56" y="392">> Task :app:installDebug</text>
  <text class="log" x="56" y="416">D/FirstApp: MainActivity created</text>
  <text class="log" x="56" y="440">D/FirstApp: Answer button clicked</text>
  <text class="tiny" x="654" y="392" fill="#cbd5e1">先看是否构建完成，再看应用日志是否出现</text>
</svg>
