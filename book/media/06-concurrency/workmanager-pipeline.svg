<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-labelledby="title desc">
  <title id="title">WorkManager 任务流水线示意图</title>
  <desc id="desc">展示用户动作入队、约束等待、链式任务执行以及状态回流页面的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c2d12"/>
    </marker>
    <style>
      .bg { fill: #fffaf5; }
      .card { fill: #ffffff; stroke: #7c2d12; stroke-width: 2; rx: 16; ry: 16; }
      .soft { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; rx: 16; ry: 16; }
      .state { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 16; ry: 16; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 24px; fill: #3f3f46; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 18px; fill: #431407; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; fill: #52525b; }
      .line { stroke: #7c2d12; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #4d7c0f; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="440"/>
  <text class="label" x="40" y="52">WorkManager：从“提交任务意图”到“状态回到页面”</text>

  <rect class="card" x="36" y="98" width="176" height="110"/>
  <text class="label" x="72" y="140">Publish</text>
  <text class="small" x="72" y="170">用户点击发送草稿</text>

  <rect class="soft" x="252" y="86" width="212" height="136"/>
  <text class="label" x="280" y="128">Unique Work</text>
  <text class="small" x="280" y="160">publish_draft_42</text>
  <text class="tiny" x="280" y="192">先决定是否替换 / 去重</text>

  <rect class="soft" x="510" y="86" width="166" height="136"/>
  <text class="label" x="536" y="128">Constraints</text>
  <text class="small" x="536" y="160">Network.CONNECTED</text>
  <text class="tiny" x="536" y="192">不满足时先等待</text>

  <rect class="card" x="704" y="72" width="184" height="72"/>
  <text class="small" x="733" y="116">CompressPhotoWorker</text>
  <rect class="card" x="704" y="164" width="184" height="72"/>
  <text class="small" x="748" y="208">UploadDraftWorker</text>
  <rect class="card" x="704" y="256" width="184" height="72"/>
  <text class="small" x="716" y="300">MarkDraftSyncedWorker</text>

  <rect class="state" x="278" y="292" width="404" height="96"/>
  <text class="label" x="304" y="334">UI State / WorkInfo</text>
  <text class="small" x="304" y="364">Enqueued -&gt; Running -&gt; Succeeded / Failed</text>

  <path class="line" d="M 212 154 L 252 154"/>
  <path class="line" d="M 464 154 L 510 154"/>
  <path class="line" d="M 676 154 L 704 108"/>
  <path class="line" d="M 796 144 L 796 164"/>
  <path class="line" d="M 796 236 L 796 256"/>
  <path class="dash" d="M 796 328 C 796 370, 722 388, 682 388"/>
  <path class="dash" d="M 278 340 C 230 308, 188 250, 158 208"/>
  <text class="tiny" x="712" y="356">任务状态重新解释给页面</text>
</svg>
